[project]
name = "pssapi"
version = "0.8.0"
description = "A fast, typed and extensible client for the Pixel Starships API."
authors = [
    { name = "The worst.", email = "theworstpss@gmail.com" },
    { name = "Solevis"},
    { name = "architelos"}
]
license = "MIT"
readme = "README.md"
requires-python = ">= 3.11"
keywords = [
    "Pixel Starships",
    "PSS",
    "API",
    "SDK",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.10.5",
    "APScheduler>=3.10.4",
    "pytz>=2024.1",
    "websockets>=13.0",
]

[project.urls]
Repository = "https://github.com/ruuuberth/pssapi.py"
Issues = "https://github.com/ruuuberth/pssapi.py/issues"
Changelog = "https://github.com/ruuuberth/pssapi.py/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "coverage>=7.6.0",
    "pre-commit>=3.8.0",
    "pyment>=0.3.3",
    "pytest>=7.2.1",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-env>=1.1.3",
    "pytest_httpx>=0.30.0",
    "pytest-vcr>=1.0.2",
    "ruff>=0.15.21",
    "vulture>=2.11",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pssapi"]

[tool.ruff]
target-version = "py311"
line-length = 200
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".direnv",
    ".venv",
]
src = ["./src", "./tests", "./showcase.py"]

[tool.ruff.lint]
select = ["B", "C", "E", "F", "W", "I"]
ignore = ["B017", "B024", "C408"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.vulture]
min_confidence = 100
paths = ["./src/pssapi"]
sort_by_size = true
